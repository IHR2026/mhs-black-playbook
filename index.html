<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHS 6th Grade Black — Team Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--turf:#2d6a3e;--turf-dark:#27603a;--chalk:#f4f3ec;--chalk-dim:rgba(244,243,236,.55);--ink:#101010;--ink-2:#1c1c1c;--ink-3:#2a2a2a;--gold:#e8393c;--red:#ff7a7a;--muted:#9a9a92}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--chalk);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.disp{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.03em}
.mono{font-family:"IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:500}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:2px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .t{font-size:26px;line-height:.9}
header .t small{display:block;font-family:"IBM Plex Sans";font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.65;margin-bottom:4px;font-weight:600}
header .back{padding:8px 12px;border:1px solid rgba(244,243,236,.3);border-radius:4px;font-size:13px;font-weight:600}
header .back.hide{visibility:hidden}

/* nav */
nav{position:sticky;top:57px;z-index:19;display:flex;background:var(--ink-2);border-bottom:1px solid rgba(244,243,236,.12);overflow-x:auto}
nav button{flex:1;min-width:68px;padding:12px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{opacity:1;color:var(--gold);border-bottom-color:var(--gold)}

main{padding:16px;max-width:980px;margin:0 auto}
h2{font-size:30px;line-height:1;margin:6px 0 12px}
h3{font-size:22px;line-height:1;margin:18px 0 10px;color:var(--gold)}
h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:700}
p{line-height:1.5;font-size:15px}
.note{font-size:13px;color:var(--muted);line-height:1.5}

/* roster grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pcard{background:var(--ink-2);border:1px solid rgba(244,243,236,.12);border-radius:6px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:84px}
.pcard:active{background:var(--ink-3)}
.pcard .n{font-weight:700;font-size:15px;line-height:1.15}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;background:var(--ink-3);color:var(--chalk);border:1px solid rgba(244,243,236,.15)}
.tag.o{border-color:rgba(232,57,60,.6);color:var(--gold)}
.tag.d{border-color:rgba(244,243,236,.5)}
.tag.two{opacity:.6}

/* section blocks */
.block{background:var(--ink-2);border:1px solid rgba(244,243,236,.12);border-radius:8px;padding:14px;margin-bottom:12px}
.block.gold{border-color:rgba(232,57,60,.5)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 10px;border-radius:4px;border:1px solid rgba(244,243,236,.25);font-size:13px;font-weight:600}
.chip.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.chip.btn:active{background:var(--ink-3)}

/* play list */
.plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.play{background:var(--ink-2);border:1px solid rgba(244,243,236,.12);border-radius:8px;overflow:hidden;text-align:left}
.play .fld{aspect-ratio:100/62;background:var(--turf)}
.play .fld svg{display:block;width:100%;height:100%}
.play .b{padding:10px 12px}
.play .b .disp{font-size:22px;line-height:1}
.play .b .s{font-size:12px;color:var(--muted);margin-top:2px}

/* diagram */
.diagram{background:var(--turf);border-radius:8px;overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch;position:relative}
.diagram svg{display:block;width:100%;height:auto}
.diagram.zoom svg{min-width:760px}
.diagram::after{content:"tap to zoom";position:absolute;right:8px;top:6px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,243,236,.55);pointer-events:none}
.diagram.zoom::after{content:"tap to fit"}
@media (max-width:600px){ .diagram{margin-left:-16px;margin-right:-16px;border-radius:0} .block .diagram{margin-left:-14px;margin-right:-14px} }
@media (min-width:601px){ .diagram::after{display:none} }

/* responsibility card */
.resp{border-left:3px solid var(--gold);padding:10px 12px;background:var(--ink-3);border-radius:0 6px 6px 0;margin:8px 0}
.resp .who{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.resp .what{font-size:15px;line-height:1.45;margin-top:4px}
.resp.me{border-left-color:var(--chalk);background:#333;box-shadow:0 0 0 1px rgba(244,243,236,.25)}
.all{margin-top:10px}
details summary{cursor:pointer;font-weight:700;font-size:14px;padding:8px 0;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid rgba(244,243,236,.1);text-align:left;vertical-align:top}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.pos{font-family:"Bebas Neue",Impact,sans-serif;font-size:20px;color:var(--gold);white-space:nowrap}
td .two{color:var(--muted);font-size:12px;display:block}
tr.me td{background:rgba(232,57,60,.12)}
input[type=file]{display:none}
.hidden{display:none}
textarea,pre{width:100%;background:#000;color:var(--chalk);border:1px solid rgba(244,243,236,.2);border-radius:6px;padding:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.5;white-space:pre-wrap}
.warn{border-left:3px solid var(--red);padding:8px 12px;background:rgba(214,69,69,.1);font-size:13px;line-height:1.5;margin:8px 0}
.ok{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(232,57,60,.1);font-size:13px;line-height:1.5;margin:8px 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
</style>
</head>
<body>

<header>
  <div class="t disp"><small>Marcus 6th Grade · Coach McDonald</small>MHS BLACK</div>
  <button class="back hide" id="back">← Back</button>
</header>
<nav id="nav">
  <button data-v="roster" class="on">Roster</button>
  <button data-v="offense">Offense</button>
  <button data-v="defense">Defense</button>
  <button data-v="plays">Plays</button>
  <button data-v="depth">Depth</button>
  <button data-v="coach">Coach</button>
</nav>
<main id="main"></main>

<script>
/* =====================================================================
   DATA — Coach: everything the app shows lives in this block.
   Edit names/positions here, or add plays to PLAYS (schema in Coach tab).
   ===================================================================== */
const ROSTER = [
 "William A.","Charlie B.","Cason B.","Brady B.","Mario B.",
 "Tae B.","Brayden C.","Beau F.","Raymond G.","Brooks G.",
 "Dawes I.","Phoenix K.","Krue K.","Michael L.","Wade M.",
 "William M.","Camden M.","Xander M.","Logan M.","Landry N.",
 "Chase P.","Malachi R.","Logan S.","Knox S."
];

/* Packages: side, label, and each spot -> list of players who play it (no depth order shown in the app).
   hidden:true keeps a package's own section off the Offense/Defense tabs; hidden DEFENSE packages still count toward each kid's positions so backups know their jobs. */
const PACKAGES = [
 { id:"base-o", side:"O", name:"Base Offense", desc:"Zone-blocking spread. Y attached to RT, H in the left slot, X and Z on the line.",
   spots:{ X:["Chase P.","Malachi R."], LT:["Camden M.","Wade M."], LG:["Logan M.","Tae B."],
           C:["Charlie B.","Logan M."], RG:["Raymond G.","Brady B."], RT:["Dawes I.","William M."],
           Y:["Beau F.","Logan S."], Z:["Mario B.","Malachi R."], H:["William A.","Krue K."],
           QB:["Brooks G."], RB:["Phoenix K.","Knox S."] } },
 { id:"marauder", hidden:true, side:"O", name:"Marauder", desc:"Base offense with Tae at LG and Malachi at X.",
   spots:{ X:["Malachi R."], LT:["Camden M."], LG:["Tae B."], C:["Charlie B."],
           RG:["Raymond G."], RT:["Dawes I."], Y:["Beau F."], Z:["Mario B."],
           H:["William A."], QB:["Brooks G."], RB:["Phoenix K."] } },
 { id:"base-d", side:"D", name:"Base Defense 3-5-3", desc:"NG, two DEs over the tackles, two Edges just outside, three LBs, two corners, one safety.",
   spots:{ S:["Landry N.","Malachi R."], CBL:["Xander M.","Cason B."], CBR:["Krue K.","William A."],
           OLBL:["Mario B.","Beau F."], MIKE:["Brayden C.","Phoenix K."], OLBR:["Malachi R.","Beau F."],
           EDGEL:["Knox S.","Raymond G."], DEL:["Wade M.","William M."], NG:["Brady B.","Tae B."],
           DER:["Tae B.","Michael L."], EDGER:["Logan S.","Raymond G."] } },
 { id:"red", hidden:true, side:"D", name:"Red", desc:"Big-body front: Cam and Dawes at DE, Tae at DT.",
   spots:{ S:["Malachi R."], CBL:["Xander M."], CBR:["Krue K."], OLBL:["Mario B."], MIKE:["Phoenix K."],
           OLBR:["Beau F."], EDGEL:["Knox S."], DEL:["Camden M."], NG:["Tae B."], DER:["Dawes I."], EDGER:["Logan S."] } }
];

/* Display labels for spots (NG shows as DT in Red) */
const LABEL = { CBL:"CB", CBR:"CB", OLBL:"OLB", OLBR:"OLB", EDGEL:"EDGE", EDGER:"EDGE", DEL:"DE", DER:"DE" };
const labelOf = (spot, pkg) => (pkg && pkg.id==="red" && spot==="NG") ? "DT" : (LABEL[spot]||spot);

/* Position groups so a kid's study page groups the right plays */
const GROUP = { X:"WR", Z:"WR", Y:"TE", H:"H", LT:"OL", LG:"OL", C:"OL", RG:"OL", RT:"OL", QB:"QB", RB:"RB",
                S:"S", CBL:"CB", CBR:"CB", OLBL:"OLB", OLBR:"OLB", MIKE:"MIKE", EDGEL:"EDGE", EDGER:"EDGE", DEL:"DE", DER:"DE", NG:"NG" };

/* Offense formations (100 wide, offense faces up, LOS at y=20). Plays reference one by key. */
const FORMATIONS = {
 "base-right":   { name:"Base Right", code:"(11) RT", desc:"Y attached tight to the RT. H in the left slot, off the ball. X and Z wide on the line. QB in the gun, RB beside him on the left.",
                   attached:["Y"], spots:{ X:[8,22], H:[19,29], LT:[30,22], LG:[40,22], C:[50,22], RG:[60,22], RT:[70,22], Y:[77.5,24], Z:[92,22], QB:[50,33], RB:[42,35] } },
 "pistol-right": { name:"Pistol Base Right", code:"(11) RT Pistol", desc:"Base Right with the RB directly behind the QB instead of beside him.",
                   attached:["Y"], spots:{ X:[8,22], H:[19,29], LT:[30,22], LG:[40,22], C:[50,22], RG:[60,22], RT:[70,22], Y:[77.5,24], Z:[92,22], QB:[50,31], RB:[50,39] } },
 "base-left":    { name:"Base Left", code:"(11) LT", desc:"Base Right flipped: Y attached to the left, Z wide left, H in the right slot, X wide right. QB in the gun, RB beside him on the right.",
                   attached:["Y"], spots:{ Z:[8,22], Y:[22.5,24], LT:[30,22], LG:[40,22], C:[50,22], RG:[60,22], RT:[70,22], H:[81,29], X:[92,22], QB:[50,33], RB:[58,35] } },
 "doubles-right": { name:"Doubles Right", code:"2x2", desc:"Two receivers each side: X wide left with H in the slot, Z wide right with Y in the slot. QB in the gun, RB beside him to the boundary side.",
                    spots:{ X:[8,22], H:[21,29], LT:[30,22], LG:[40,22], C:[50,22], RG:[60,22], RT:[70,22], Y:[79,29], Z:[92,22], QB:[52,33], RB:[43,35] } },
 "pro-right": { name:"Gun Right", code:"(21) RT", desc:"Y attached to the right off the ball, X and Z on the line. QB in the gun with both backs beside him — RB on the left, H on the right.",
                attached:["Y"], spots:{ X:[8,22], LT:[30,22], LG:[40,22], C:[50,22], RG:[60,22], RT:[70,22], Y:[77.5,24], Z:[92,22], QB:[50,33], RB:[42,35], H:[58,35] } },
 "pro-left":  { name:"Gun Left", code:"(21) LT", desc:"Gun Right flipped: Y attached to the left, Z on the line left, X on the line right. QB in the gun, backs mirrored — H on the left, RB on the right.",
                attached:["Y"], spots:{ Z:[8,22], LT:[30,22], LG:[40,22], C:[50,22], RG:[60,22], RT:[70,22], Y:[22.5,24], X:[92,22], QB:[50,33], H:[42,35], RB:[58,35] } }
};
const OFORM = FORMATIONS["base-right"].spots;
const ONLINE = ["X","LT","LG","C","RG","RT","Z"];
const formsOf = play => play.side==="O" ? (play.formations && play.formations.length ? play.formations : [play.formation||"base-right"]) : [];
const formOf = play => (play.side==="O" && FORMATIONS[play.formation||"base-right"]) ? FORMATIONS[play.formation||"base-right"].spots : (play.side==="O" ? OFORM : DFORM);
/* Hole numbers -> x on the line. Even = right of center, odd = left. */
const HOLES = { 1:45, 2:55, 3:35, 4:65, 5:25, 6:74, 7:15, 8:86 };
const BACKS = { 1:"QB", 2:"RB", 3:"H" };
const GAP = { 1:"1 hole is the A gap — right next to the center on the left.", 2:"2 hole is the A gap — right next to the center on the right.",
              3:"3 hole is the B gap — between the left guard and left tackle.", 4:"4 hole is the B gap — between the right guard and right tackle.",
              5:"5 hole is the C gap — just outside the left tackle.", 6:"6 hole is the C gap — outside the right tackle, inside the Y.",
              7:"7 hole is outside everything on the left — it's a TOSS. Catch the pitch with your hands, get wide, follow the pulling linemen, then get north.", 8:"8 hole is outside everything on the right — it's a TOSS. Catch the pitch with your hands, get wide, follow the pulling linemen, then get north." };
const LEAD = { 1:"Lead through the 1 hole and clean out the first defender there.", 2:"Run across and lead through the 2 hole — clean out the first defender there.",
               3:"Lead through the 3 hole and clean out the first defender there.", 4:"Run across and lead through the 4 hole — clean out the first defender there.",
               5:"Lead through the 5 hole; kick out the first defender outside the tackle.", 6:"Run across and lead through the 6 hole; kick out the first defender outside the tackle.",
               7:"Arc block: get outside and kick out the force player (Edge or OLB). The RB runs off your block.", 8:"Run across and arc block: get outside and kick out the force player. The RB runs off your block." };
const holeText = (t,h) => t.replace("{hole}",h).replace("{gap}",GAP[h]||"").replace("{lead}",LEAD[h]||"");
/* Defense formation coordinates (defense faces down, LOS at y=20, deep = smaller y) */
const DFORM = { CBL:[8,17], EDGEL:[23,17], DEL:[37,17], NG:[53.5,17], DER:[63,17], EDGER:[77,17], CBR:[92,17], OLBL:[31,9], MIKE:[50,9], OLBR:[69,9], S:[50,-4] };

/* General position guides */
const GUIDE = {
 OL:{ title:"Offensive Line — Zone Blocking", text:"We zone block toward the play call. EVEN second number, everybody steps RIGHT; ODD, everybody steps LEFT. Play-side tackle + tight end (or H) double team the end, then the tackle sheds and climbs to the linebacker. Center + play-side guard double team the tackle; if he shoots the A gap the guard chips him and climbs to the linebacker. Backside guard takes the tackle if he comes into the A gap. Backside tackle chips the end and climbs to the linebacker — unless the tackle shoots the B gap, then he fills that hole. Every double team: four hands on him, drive him, and the one who is not needed goes to a linebacker. TOSS RULE (27 and 28 only): if you are a backside guard or tackle and nobody is lined up on you, pull to the play side and lead around the corner. Never chase a defender backwards, stay square, keep your feet moving." },
 QB:{ title:"Quarterback", text:"1-back. You run the huddle and the cadence. Make sure the handoff is clean before anything else — ball security first. Sell every fake like it's the real play." },
 RB:{ title:"Running Back — 2 back", text:"You are the 2 back. Any play that starts with a 2 is your ball. The second number is the hole. Even holes are right of center, odd holes are left. Take the handoff with the inside arm up, read the first defender at the hole, and make one cut — then get north." },
 H:{ title:"H-back — 3 back", text:"You are the 3 back. Any play that starts with a 3 is your ball. From the slot (Base) you are a blocker on every 20-series run and you have to get off the ball FAST: run to your side (odd) — block the Edge; run away from you (even) — climb and block the linebacker on your side. From Gun (in the backfield next to the QB) you lead block through the hole for the RB." },
 TE:{ title:"Y / Tight End", text:"Attached to the RT, off the ball. On runs your way you're another zone blocker on the front side. On runs away you cut off the backside pursuit. On pass, you're the first read for the QB." },
 WR:{ title:"X and Z Receivers", text:"X is on the line to the left, Z is on the line to the right outside the Y. On every run play your job is to stalk block the corner — drive off the ball like it's a pass, get square, and stay between him and the runner." },
 DE:{ title:"Defensive End", text:"Head-up on the tackle. Every down, run or pass, you go to your B gap — the gap between the guard and the tackle. Get in it on the snap, stay square, keep your outside arm free." },
 NG:{ title:"Nose Guard / DT", text:"You line up IN the strong-side A gap — between the center and the guard on the side the Y/TE is on (no TE? the RB's side). Find the Y before the snap and get in that gap. Then every single snap, run or pass, you stunt hard through it: low, fast, first step on the snap. You are not reading anything — you are going. Never get pushed back." },
 EDGE:{ title:"Edge", text:"Just outside the tackle (or the Y). Every snap you arc: get upfield around the outside. Run: squeeze back in behind the tackle and contain — nothing gets outside you, turn it back inside. Pass: keep arcing and get to the QB." },
 OLB:{ title:"Outside Linebacker", text:"Stacked 4–5 yards deep behind the DE/Edge area. Run: your gap is the C gap (just outside the tackle, between the DE and the Edge) — first step forward, into it. But read the ball: if it's coming to your C gap, fill it and attack; if it goes anywhere else, don't stand in an empty gap — flow to the ball and hit him. Never take a step backward on a run. Pass (Cover 3): drop to your flat. Zone is not standing in a spot — find the receiver in your flat and stay with him until he leaves it. If the QB rolls toward you, get to the flat fast; if he rolls away, slide hard into the middle and find the crosser." },
 MIKE:{ title:"Mike Linebacker", text:"Middle, 4–5 yards deep behind the NG. Run: read the RB and go get him. You don't have a gap — flow with the ball, first step forward, come downhill and attack through the first open lane. Never take a step backward on a run. Pass (Cover 3): drop to the middle zone and read the QB's eyes. Zone is not standing in a spot — find the receiver in your zone and stay with him until he leaves it. If the QB rolls out, slide to that side of your zone — go where he's looking, not where he is." },
 CB:{ title:"Cornerback", text:"5–7 yards off, outside the receiver. Run: force — make the ball turn back inside, then tackle. Pass (Cover 3): bail to your deep third, find the receiver in it, and stay with him until he leaves. Nobody gets behind you, ever. If the QB rolls the other way, slide your third toward the middle." },
 S:{ title:"Safety", text:"Deep middle, 10–12 yards. Run: last line — come down through the alley and clean it up. Pass (Cover 3): deep middle third. Stay deeper than the deepest receiver. Zone is not standing in a spot — find the deepest receiver in your third and stay over the top of him. If the QB rolls out, shade your third to that side — he can't throw back across his body." }
};

/* =====================================================================
   PLAYS — one object per play. `assign` maps spot -> { job, path, kind }.
   kind: run (gold), block (chalk, ends in a bar), fake (dashed), zone (shaded box: path=[x,y,w,h])
   Coordinates use the formation grids above.
   ===================================================================== */
const PLAYS = [
 { id:"20-right", side:"O", name:"20s Run Right", concept:true, carrier:"RB", holes:[2,4,6,8], defaultHole:2, sub:"RB · even hole · everybody zones RIGHT", series:"20", pkg:"base-o", formation:"base-right",
   summary:"One concept, four holes. Any 20-series play with an EVEN second number is the RB running to the right. The second number tells the RB which gap: 2 = A gap (next to center), 4 = B gap (guard/tackle), 6 = C gap (outside the tackle, inside the Y), 8 = outside everything. Everybody else does the exact same thing on all four. Zone rules going right: RT + Y double the DE and the RT sheds to the LB; C + RG double the DT and the RG chips off to the LB if the DT shoots the A gap; LG takes the DT if he comes to the A gap; LT chips the End and climbs to the LB (or fills the B gap if the DT shoots there). H climbs to the backside LB, X and Z stalk block. Only the ball carrier's aim point changes.",
   assign:{
     RB:{ dyn:true, job:"Your ball — even number means you're going RIGHT. {gap} Take the handoff with your inside arm up, aim at the {hole} hole, read the first defender there, one cut, get north. Never dance.", kind:"run" },
     H:{ job:"Even number = the ball is going AWAY from you. Get off the ball fast and climb straight to the linebacker on your side — the OLB. Cut him off before he can flow to the ball. Same on 22, 24, 26 and 28.", kind:"block", path:[[19,29],[22,20],[27,12]] },
     QB:{ job:"Even number = open to your RIGHT. Reverse out, hand the ball to the RB deep in his belly (on 28 it's a TOSS — pitch it out in front of him), then carry out a boot fake to the LEFT. Sell it every time.", kind:"fake", path:[[50,33],[46,36],[36,38]] },
     LT:{ job:"Even number = zone step RIGHT. You are backside: chip the End with your inside shoulder, then climb and block the backside LB. One exception — if the DT shoots into the B gap between you and the LG, he's yours: fill that hole and block him. Same on 22, 24, 26 and 28.", kind:"block", path:[[30,22],[27,18],[31,11]], alt:[[30,22],[34,16]], byHole:{8:{ job:"28 TOSS — if nobody is lined up on you (uncovered), PULL to the play side: run flat behind the line to the right, get around the corner, and block the first defender that shows outside. If you are covered, chip the End and climb like normal.", path:[[30,22],[34,32],[62,32],[78,23],[85,15]], alt:null }} },
     LG:{ job:"Even number = zone step RIGHT. Take the DT if he shoots into the A gap between you and the center. If he shoots the B gap instead, the LT has him — you keep stepping right and climb to the backside LB. Same on every even play.", kind:"block", path:[[40,22],[45,16]], alt:[[40,22],[44,14],[49,9]], byHole:{8:{ job:"28 TOSS — if nobody is lined up on you (uncovered), PULL to the play side: run flat behind the line to the right, get around the corner, and kick out the first defender that shows outside. If you are covered, take him like normal.", path:[[40,22],[44,30],[64,30],[80,21],[87,13]], alt:null }} },
     C:{ job:"Even number = zone step RIGHT. Double team the play-side DT with the RG — four hands on him, drive him back. If he shoots the A gap the RG chips him and leaves; you stay on him. Same on every even play.", kind:"block", path:[[50,22],[55,16]] },

 { id:"20-left", side:"O", name:"20s Run Left", concept:true, carrier:"RB", holes:[1,3,5,7], defaultHole:1, sub:"RB · odd hole · everybody zones LEFT", series:"20", pkg:"base-o", formation:"base-right",
   summary:"Same concept, other direction. Any 20-series play with an ODD second number is the RB running to the left. 1 = A gap (next to center), 3 = B gap (guard/tackle), 5 = C gap (outside the tackle), 7 = outside everything (sweep). Everybody else does the exact same thing on all four. Zone rules going left (mirror of right): LT + H double the DE and the LT sheds to the LB; C + LG double the DT and the LG chips off to the LB if the DT shoots the A gap; RG takes the DT if he comes to the A gap; RT chips the End and climbs to the LB (or fills the B gap if the DT shoots there). X and Z stalk block. 27 is a TOSS: any backside guard or tackle who is uncovered pulls to the play side and leads.",
   assign:{

     H:{ job:"Odd number = the ball is coming to YOUR side. Get off the ball FAST and double team the DE with the LT; when the LT sheds to the LB, the DE is all yours — keep him sealed. On 27 you block the Edge instead: head outside him, wall him in. That block springs the sweep. Same on every odd play.", kind:"block", path:[[19,29],[27,17]], alt:[[19,29],[21,22],[23,17]], byHole:{7:{ path:[[19,29],[21,22],[23,17]], alt:null }} },

     LG:{ job:"Odd number = zone step LEFT. Double team the DT with the center. If the DT shoots the A gap, chip him (one hard shot) and move up to the LB. On 23 the RB is reading your block. Same on every odd play.", kind:"block", path:[[40,22],[44,17],[49,9]] },

     RG:{ job:"Odd number = zone step LEFT. Take the DT if he shoots into the A gap between you and the center. If he shoots the B gap instead, the RT has him — you keep stepping left and climb to the backside LB. Same on every odd play.", kind:"block", path:[[60,22],[55,16]], alt:[[60,22],[56,14],[51,9]], byHole:{7:{ job:"27 TOSS — if nobody is lined up on you (uncovered), PULL to the play side: run flat behind the line to the left, get around the corner, and kick out the first defender that shows outside. If you are covered, take him like normal.", path:[[60,22],[56,30],[36,30],[20,21],[13,13]], alt:null }} },

 { id:"ypop", side:"O", name:"18 Run Pop Pass", sub:"Looks like 18 · QB rolls to the 8 hole · Y pops inside · RB blocks the end then flat", series:"10", pkg:"base-o", formation:"base-right",
   summary:"Treat this like a run play. It's called 18: even number, everybody goes RIGHT and blocks exactly like 28 — line zones right, H climbs to the linebacker, X and Z stalk block. The QB is the 1 back: he takes the snap and rolls to the 8 hole like he's running it. The Y chips the end and breaks INSIDE, turning around at 3–5 yards for a quick throw. The RB blocks that same end so he can't get in the backfield; if nobody's there he releases to the flat. QB: Y first, RB in the flat second, run it third.",
   assign:{
     Y:{ job:"Your ball. Fire off like it's 28 and chip the end (DE) with your inside shoulder — one hard hit. Then break INSIDE, 3–5 yards deep, turn around, hands up, eyes on the QB. The ball is coming right now. Catch it and turn upfield.", kind:"route", path:[[77.5,24],[72,19],[69,13],[67,15]] },
     QB:{ job:"You're the 1 back — sell 18. Take the snap and roll RIGHT to the 8 hole like you're running it. Throw to the Y the second he turns inside — do not wait. Not there? RB in the flat. Not there either? Tuck it and run the 8 hole.", kind:"run", path:[[50,33],[60,34],[76,31],[86,25],[88,12]] },
     RB:{ job:"Block the end the Y is chipping — attack him and make sure he does NOT get in the backfield. If nobody shows up there, release to the flat: get to the sideline at 5 yards and look back for the ball right away.", kind:"block", path:[[42,35],[52,38],[64,29],[68,21]], alt:[[42,35],[56,39],[80,33],[93,20]] },
     H:{ job:"Even number = the ball is going AWAY from you. Same as 28: get off the ball fast and climb to the OLB on your side. Sell run.", kind:"block", path:[[19,29],[22,20],[27,12]] },
     X:{ job:"Same as every run: stalk block your corner. Sell run.", kind:"block", path:[[8,22],[10,12]] },
     Z:{ job:"Same as every run: stalk block the corner. Drive off, get square, stay in front of him. Sell run — the roll and the throw are coming your way.", kind:"block", path:[[92,22],[92,10]] },
     LT:{ job:"Zone step RIGHT exactly like 28. Backside: chip the End and climb to the backside LB. Sell run.", kind:"block", path:[[30,22],[27,18],[31,11]] },
     LG:{ job:"Zone step RIGHT exactly like 28. Take the DT if he shoots the A gap, otherwise climb. Sell run.", kind:"block", path:[[40,22],[45,16]] },
     C:{ job:"Zone step RIGHT exactly like 28. Double the DT with the RG. Sell run.", kind:"block", path:[[50,22],[55,16]] },
     RG:{ job:"Zone step RIGHT exactly like 28. Double the DT with the center, chip off to the LB if he shoots the A gap. Sell run.", kind:"block", path:[[60,22],[56,17],[51,9]] },
     RT:{ job:"Zone step RIGHT exactly like 28. The Y chips the DE and leaves, and the RB is coming to block him — you take him first, then climb to the LB. Sell run.", kind:"block", path:[[70,22],[73,16],[69,10]] }

 { id:"cover3", side:"D", name:"Cover 3", sub:"Every-down pass coverage · edge arc blitz · DL stunt", pkg:"base-d",
   summary:"Standard passing coverage. Three deep, two flats, middle zone. Edges arc and blitz, DEs slant into the B gaps, NG slants to the strong-side A gap. ZONE IS NOT STANDING IN A SPOT: get to your zone, find the receiver in it, and cover him like it's man until he leaves your zone — then find the next one. If the QB rolls out, every zone slides toward him.",
   assign:{
     CBL:{ job:"Bail to your deep third. Find the receiver in it and stay with him until he leaves your zone. Nobody gets behind you. If the QB rolls the other way, slide your third toward the middle.", kind:"zone", path:[1,-14,32,13], from:[8,17] },
     CBR:{ job:"Bail to your deep third. Find the receiver in it and stay with him until he leaves your zone. Nobody gets behind you. If the QB rolls the other way, slide your third toward the middle.", kind:"zone", path:[67,-14,32,13], from:[92,17] },
     S:{ job:"Deep middle third. Find the deepest receiver in it and stay over the top of him until he leaves your zone. Break on the ball. If the QB rolls out, shade your third to that side — he can't throw back across the field.", kind:"zone", path:[34,-14,32,13], from:[50,-4] },
     OLBL:{ job:"Drop to the flat. Re-route the Y or slot on the way, then find the receiver in your flat and stay with him until he leaves it. If the QB rolls away from you, slide hard into the middle and find the crosser — never stand in an empty flat.", kind:"zone", path:[1,4,18,11], from:[31,9] },
     OLBR:{ job:"Drop to the flat. Re-route the Y or slot on the way, then find the receiver in your flat and stay with him until he leaves it. If the QB rolls away from you, slide hard into the middle and find the crosser — never stand in an empty flat.", kind:"zone", path:[81,4,18,11], from:[69,9] },
     MIKE:{ job:"Drop to the middle zone, 8–10 yards. Read the QB's eyes, find the receiver in your zone and stay with him until he leaves it — then find the next one. If the QB rolls out, slide to that side of your zone (see Cover 3 vs. Rollout).", kind:"zone", path:[38,-2,24,9], from:[50,9] },
     EDGEL:{ job:"Arc rush — get width around the outside, then get to the QB. Contain first: don't let him escape outside you.", kind:"run", path:[[23,17],[20,24],[28,30]] },
     EDGER:{ job:"Arc rush around the outside (around the Y). Contain, then get to the QB.", kind:"run", path:[[77,17],[80,24],[74,30]] },
     DEL:{ job:"Stunt — slant hard into your B gap (guard/tackle).", kind:"run", path:[[37,17],[40.5,28]] },
     DER:{ job:"Stunt — slant hard into your B gap (guard/tackle).", kind:"run", path:[[63,17],[59.5,28]] },
     NG:{ job:"Line up in the strong-side A gap (Y/TE side) and stunt hard through it — same as every snap. Get to the QB.", kind:"run", path:[[53.5,17],[53.5,29]] }

 { id:"cover3-roll", side:"D", name:"Cover 3 vs. Rollout", sub:"QB rolls right · zones slide with him · mirror it if he rolls left", pkg:"base-d",
   ghost:{ path:[[50,31],[57,33],[68,33]] },
   summary:"Same Cover 3, but the QB can only throw to the side he's rolling to — so the middle of the field slides with him. Read his eyes and his shoulders. Mike and the safety shift to the roll side of their zones and find the receiver in it. EVERYBODY slides toward the roll — the backside OLB the most (into the middle), the backside corner a few yards too. And zone is not standing in a spot: find the receiver in your zone and STAY with him until he leaves it. If the QB tucks it and runs, everybody comes downhill.",

/* Every spot a kid holds: [{pkg, spot, string}] */
function assignments(name){
  const out=[];
  PACKAGES.filter(k=>!k.hidden||k.side==="D").forEach(pkg=>Object.entries(pkg.spots).forEach(([spot,list])=>{
    const i=list.indexOf(name); if(i>=0) out.push({pkg,spot,string:i+1});
  }));
  return out;
}

/* ---------- SVG diagram renderer ---------- */
function diagram(play, highlight, fkey, hole){
  const O = play.side==="O";
  hole = hole || play.defaultHole;
  const FO = O ? (FORMATIONS[fkey||play.formation||"base-right"]||FORMATIONS["base-right"]) : null;
  const F = O ? FO.spots : {...DFORM, ...(play.align||{})};
  const attached = (FO&&FO.attached)||[];
  const vb = O ? "0 0 100 50" : "0 -18 100 52";
  const a = play.assign||{};
  let s = `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">
  <defs>
   <marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8393c"/></marker>
   <marker id="mw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4f3ec"/></marker>
   <marker id="mb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M5,0 L5,10" stroke="#f4f3ec" stroke-width="2.5"/></marker>
  </defs>`;
  // yard stripes
  const top = O?0:-18, h = O?50:52;
  for(let y=top;y<top+h;y+=5) s+=`<rect x="0" y="${y}" width="100" height="5" fill="${((y-top)/5)%2?'#27603a':'#2d6a3e'}"/>`;
  s+=`<rect x="0" y="19.7" width="100" height=".6" fill="#f4f3ec"/>`;
  // ghost opponents
  if(O){ [[31,15,"DE"],[54,15,"NG"],[69,15,"DE"],[23,15,"E"],[78,15,"E"],[31,8,"LB"],[50,8,"LB"],[69,8,"LB"],[8,13,"CB"],[92,13,"CB"]].forEach(([x,y,t])=>s+=ghost(x,y,t)); }
  else { (play.ghosts||[[37,25,"T"],[43.5,25,"G"],[50,25,"C"],[56.5,25,"G"],[63,25,"T"],[70,25,"Y"],[50,31,"Q"],[50,38,"R"],[12,25,"X"],[90,25,"Z"],[22,29,"H"]]).forEach(([x,y,t])=>s+=ghost(x,y,t)); }
  if(play.ghost && play.ghost.path){ s+=`<path d="M${play.ghost.path.map(p=>p.join(",")).join(" L")}" fill="none" stroke="rgba(244,243,236,.7)" stroke-width=".7" stroke-dasharray="1.4 1" marker-end="url(#mw)"/>`; }
  // zones first
  Object.entries(a).forEach(([spot,v])=>{
    if(v.kind!=="zone") return;
    const [x,y,w,hh]=v.path, me=spot===highlight;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="1.5" fill="${me?'rgba(232,57,60,.28)':'rgba(244,243,236,.14)'}" stroke="${me?'#e8393c':'rgba(244,243,236,.6)'}" stroke-width="${me?.6:.35}" stroke-dasharray="1.2 .9"/>`;
    if(v.from||F[spot]){ const [fx,fy]=F[spot]||v.from; const tx=x+w/2, ty=y+hh/2; s+=`<path d="M${fx},${fy} L${tx},${ty}" fill="none" stroke="${me?'#e8393c':'#f4f3ec'}" stroke-width="${me?.9:.6}" marker-end="url(#${me?'mg':'mw'})" opacity="${me?1:.75}"/>`; }
  });
  // arrows
  Object.entries(a).forEach(([spot,v])=>{
    if(v.kind==="zone") return;
    if(v.byHole && play.holes && v.byHole[hole]) v={...v, ...v.byHole[hole]};
    if(v.dyn && play.holes && F[spot]){ const hx=HOLES[hole], right=hole%2===0, wide=hole>=7; const [sx,sy]=F[spot];
      if(spot===play.carrier) v={...v, path: wide ? [F[spot],[right?sx+8:sx-8,sy+2],[hx,22],[hx+(right?2:-2),4]] : [F[spot],[hx,30],[hx,22],[hx,4]]};
      else v={...v, path: wide ? [F[spot],[right?hx-10:hx+10,32],[hx+(right?2:-2),17]] : [F[spot],[hx,32],[hx,18]]}; }
    if(!v.path) return;
    const me=spot===highlight;
    let start = F[spot] || v.path[0];
    if(v.pre && F[spot]){ const pre=[F[spot],...v.pre.slice(1)]; s+=`<path d="M${pre.map(p=>p.join(",")).join(" L")}" fill="none" stroke="${me?'#e8393c':'#f4f3ec'}" stroke-width="${me?.8:.55}" stroke-dasharray=".5 .9" stroke-linecap="round" opacity="${highlight&&!me?.5:.9}"/>`; start=pre[pre.length-1]; }
    const pts = [start, ...v.path.slice(1)];
    const d="M"+pts.map(p=>p.join(",")).join(" L");
    const col = v.kind==="run" ? "#e8393c" : "#f4f3ec";
    const w = me ? 1.1 : (v.kind==="run"||v.kind==="route"?.9:.6);
    const mk = v.kind==="block" ? "mb" : (v.kind==="run" ? "mg" : "mw");
    if(v.alt && F[spot]){ const ad="M"+[F[spot],...v.alt.slice(1)].map(p=>p.join(",")).join(" L"); s+=`<path d="${ad}" fill="none" stroke="${me?'#e8393c':'#f4f3ec'}" stroke-width="${me?.8:.5}" stroke-dasharray="1.2 .9" marker-end="url(#${me?'mg':'mw'})" opacity="${highlight&&!me?.4:.8}"/>`; }
    s+=`<path d="${d}" fill="none" stroke="${me?'#e8393c':col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${v.kind==="fake"?'stroke-dasharray="1.4 1"':''} marker-end="url(#${me&&v.kind!=="block"?'mg':mk})" opacity="${highlight&&!me?.55:1}"/>`;
  });
  // players
  Object.entries(F).forEach(([spot,[x,y]])=>{
    const me=spot===highlight;
    const line = O ? (ONLINE.includes(spot)||attached.includes(spot)) : ["CBL","EDGEL","DEL","NG","DER","EDGER","CBR"].includes(spot);
    const lbl = labelOf(spot, null);
    const fill = me ? "#e8393c" : (line ? "#f4f3ec" : "#101010");
    const ring = me ? "#101010" : (line ? "#101010" : "#f4f3ec");
    const tc = me ? "#101010" : (line ? "#101010" : "#e8393c");
    const r = me?3.2:2.8;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${ring}" stroke-width=".6"/>`;
    s+=`<text x="${x}" y="${y+1.1}" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="${lbl.length>2?2.3:3}" fill="${tc}">${lbl}</text>`;
  });
  return s+"</svg>";
}

  const F = O ? { X:[6,22], H:[15,31], LT:[25,22], LG:[37,22], C:[49,22], RG:[61,22], RT:[73,22], Y:[83,24.5], Z:[95,22], QB:[49,37], RB:[36,46] }
              : { CBL:[6,16], EDGEL:[21,16], DEL:[36,16], NG:[50,16], DER:[64,16], EDGER:[79,16], CBR:[94,16], OLBL:[31,1], MIKE:[50,1], OLBR:[69,1], S:[50,-14] };
  const attached = O ? ["Y"] : [];
  const vb = O ? "0 0 100 58" : "0 -22 100 57";
  const top = O?0:-22, h = O?58:57;
  let s = `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">`;
  for(let y=top;y<top+h;y+=5) s+=`<rect x="0" y="${y}" width="100" height="5" fill="${((y-top)/5)%2?'#27603a':'#2d6a3e'}"/>`;
  s+=`<rect x="0" y="${O?19.7:26.7}" width="100" height=".6" fill="#f4f3ec"/>`;
  if(O){ [[31,15,"DE"],[50,15,"NG"],[69,15,"DE"],[23,15,"E"],[78,15,"E"],[31,8,"LB"],[50,8,"LB"],[69,8,"LB"],[8,13,"CB"],[92,13,"CB"]].forEach(([x,y,t])=>s+=ghost(x,y,t)); }
  else { [[37,31,"T"],[43.5,31,"G"],[50,31,"C"],[56.5,31,"G"],[63,31,"T"]].forEach(([x,y,t])=>s+=ghost(x,y,t)); }
  Object.entries(F).forEach(([spot,[x,y]])=>{
    const names = pkg.spots[spot]||[];
    const line = O ? (ONLINE.includes(spot)||attached.includes(spot)) : ["CBL","EDGEL","DEL","NG","DER","EDGER","CBR"].includes(spot);
    const lbl = labelOf(spot,pkg);
    s+=`<circle cx="${x}" cy="${y}" r="2.6" fill="${line?'#f4f3ec':'#101010'}" stroke="${line?'#101010':'#f4f3ec'}" stroke-width=".6"/>`;

    if(names[0]){ const w=Math.max(7,names[0].length*1.0+1.6); s+=`<rect x="${x-w/2}" y="${y+3.4}" width="${w}" height="3" rx=".5" fill="#f4f3ec"/><text x="${x}" y="${y+5.6}" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-weight="700" font-size="1.9" fill="#101010">${esc(names[0])}</text>`; }
    if(names[1]){ const w=Math.max(7,names[1].length*0.9+1.6); s+=`<rect x="${x-w/2}" y="${y+6.8}" width="${w}" height="2.7" rx=".4" fill="#101010"/><text x="${x}" y="${y+8.75}" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-weight="600" font-size="1.7" fill="#f4f3ec">${esc(names[1])}</text>`; }
  });
  return s+"</svg>";
}
function ghost(x,y,t){ return `<circle cx="${x}" cy="${y}" r="1.9" fill="none" stroke="rgba(244,243,236,.45)" stroke-width=".35" stroke-dasharray=".7 .5"/><text x="${x}" y="${y+.8}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="1.8" fill="rgba(244,243,236,.55)">${t}</text>`; }

/* ---------- views ---------- */
function go(v, push=true){
  if(push){ stack.push({view,html:main.innerHTML,scroll:window.scrollY}); }
  view=v.view||v;
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
  back.classList.toggle("hide", stack.length===0);
  if(v.render) v.render(); else VIEWS[view]();
  window.scrollTo(0,0);
}
nav.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; stack=[]; go(b.dataset.v,false); });
back.addEventListener("click", ()=>{ const s=stack.pop(); if(!s) return; view=s.view; main.innerHTML=s.html; nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===view)); back.classList.toggle("hide", stack.length===0); window.scrollTo(0,s.scroll); });

   <h3 class="disp">Offense</h3><p class="note">Runs are two concepts, not nine plays: EVEN number = everybody goes RIGHT, ODD number = everybody goes LEFT. First digit is who carries (2 = RB, 3 = H, 1 = QB). Second digit is the hole: 1/2 next to the center, 3/4 between guard and tackle, 5/6 outside the tackle, 7/8 the sweep. Blockers do the same thing on every play in a direction — only the runner&#39;s aim point changes. &quot;H Jet&quot; means the H motions toward the QB before the snap.</p>
   <div class="plays" style="margin-top:10px">${plays.filter(p=>p.side==="O").map(playCard).join("")}</div>
   <h3 class="disp">Formations</h3><p class="note">Where everybody lines up before the snap. White circles are on the line or attached to it; black circles are off the ball (slot, backfield).</p>
   <div class="plays" style="margin-top:10px">${Object.entries(FORMATIONS).map(([k,f])=>`<div class="play"><div class="fld">${diagram({side:"O",formation:k,assign:{}})}</div><div class="b"><div class="disp">${esc(f.name)}${f.code?` <span style="color:var(--muted);font-size:16px">${esc(f.code)}</span>`:""}</div><div class="s">${esc(f.desc)}</div></div></div>`).join("")}</div>
   <h3 class="disp">Defense</h3><p class="note">Cover 3 is our every-down passing coverage.</p>
   <div class="plays" style="margin-top:10px">${plays.filter(p=>p.side==="D").map(playCard).join("")}</div>
   <div class="legend"><span><i style="background:#e8393c"></i>Ball carrier / rush</span><span><i style="background:#f4f3ec"></i>Route, block or drop</span><span><i style="background:repeating-linear-gradient(90deg,#f4f3ec 0 4px,transparent 4px 7px)"></i>Fake / conversion</span><span><i style="background:repeating-linear-gradient(90deg,#f4f3ec 0 2px,transparent 2px 5px)"></i>Motion</span></div>`;
  wirePlays();
 },
 depth(){
  main.innerHTML = `<h2 class="disp">Depth Charts</h2>` + PACKAGES.map(pkg=>`<div class="block"><h3 class="disp" style="margin-top:0">${esc(pkg.name)}</h3><div class="diagram">${depthChart(pkg)}</div></div>`).join("");
 },
 coach(){
  const schema = JSON.stringify({ id:"24", side:"O", name:"24", sub:"RB inside zone · 4 hole", series:"20", pkg:"base-o", summary:"What the play is.", assign:{ RB:{ job:"Your ball...", kind:"run", path:[[50,43],[62,22],[64,8]] }, LT:{ job:"Zone step right.", kind:"block", path:[[30,22],[36,15]] } } }, null, 1);
  main.innerHTML = `<h2 class="disp">Coach</h2>
   <div class="block gold"><h4>Load plays</h4><p>Pick a <b>.json</b> file with one play or a list of plays. They're added to the playbook for this session (a play with the same id replaces the built-in one). To make plays permanent, paste them into the <code>PLAYS</code> list inside this file, or export below and hand the file to whoever maintains the app.</p>
     <div class="row" style="margin-top:10px"><label class="chip btn gold" for="file">Upload play file</label><input type="file" id="file" accept=".json,application/json"><button class="chip btn" id="export">Export playbook (.json)</button></div>
     <div id="msg"></div></div>
   <div class="block"><h4>Play format</h4><p class="note">Spots on offense: X, LT, LG, C, RG, RT, Y, Z, H, QB, RB. Defense: CBL, CBR, S, OLBL, MIKE, OLBR, EDGEL, DEL, NG, DER, EDGER. <code>kind</code> is <code>run</code> (gold arrow), <code>route</code> (white arrow), <code>block</code> (white, ends in a bar), <code>fake</code> (dashed), optional <code>alt</code> path (dashed, for a route conversion), optional <code>pre</code> path (dotted pre-snap motion; the main path then starts where the motion ends) or <code>zone</code> (shaded box: path = [x, y, width, height], optional <code>from</code> = [x, y]). The first point of any path is replaced by where that position lines up in the play&#39;s formation, so you only need to draw where they go. Offense plays can set <code>formation</code> to one of: ${Object.keys(FORMATIONS).map(k=>`<code>${k}</code>`).join(", ")} (default <code>base-right</code>), or <code>formations</code> to a list to show the same play from several looks. A run concept can set <code>holes</code> (list), <code>carrier</code> and <code>defaultHole</code>; positions with <code>dyn: true</code> get their path drawn to the chosen hole, and their job text can use {hole}, {gap} and {lead}. Any position can add <code>byHole: { 8: { job, path } }</code> to override its job or drawing for one hole. Defense plays can set <code>align</code> (spot → [x,y] to shift a player's alignment for that card) and <code>ghosts</code> (a list of [x,y,label] for the offense look they are facing). A formation can list <code>attached</code> spots (e.g. the Y when he is tight to the tackle) — they draw white like the line. Coordinates: field is 100 wide, line of scrimmage is y = 20, offense is below it (bigger y), defense above.</p>
     <details><summary>Show example JSON</summary><pre>${esc(schema)}</pre></details>
     <details><summary>Alignment coordinates</summary><pre>${Object.entries(FORMATIONS).map(([k,f])=>k+": "+esc(JSON.stringify(f.spots))).join("\n")}\nDefense: ${esc(JSON.stringify(DFORM))}\nHoles:   ${esc(JSON.stringify(HOLES))}</pre></details></div>
`;
  document.getElementById("file").addEventListener("change", e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ let j=JSON.parse(r.result); if(!Array.isArray(j)) j=[j]; let n=0;
        j.forEach(p=>{ if(!p.id||!p.side||!p.assign) throw new Error("Each play needs id, side and assign"); const i=plays.findIndex(q=>q.id===p.id); if(i>=0) plays[i]=p; else plays.push(p); n++; });
        document.getElementById("msg").innerHTML=`<div class="ok">Loaded ${n} play${n===1?"":"s"} from ${esc(f.name)}. Check the Plays tab.</div>`;
      }catch(err){ document.getElementById("msg").innerHTML=`<div class="warn">Couldn't read that file: ${esc(err.message)}</div>`; } };
    r.readAsText(f);
  });
  document.getElementById("export").addEventListener("click", ()=>{
    const blob=new Blob([JSON.stringify(plays,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="mhs-black-playbook.json"; a.click();
  });
 }
};

function playCard(p){ return `<button class="play" data-play="${esc(p.id)}"><div class="fld">${diagram(p)}</div><div class="b"><div class="disp">${esc(p.name)}${p.holes?` <span style="color:var(--gold);font-size:16px">${p.holes.map(h=>(p.series?p.series[0]:"")+h).join(" · ")}</span>`:""}</div><div class="s">${esc(p.sub||"")}</div></div></button>`; }
function wirePlays(){}
main.addEventListener("click", e=>{ const d=e.target.closest(".diagram"); if(d && window.innerWidth<=600){ d.classList.toggle("zoom"); return; } const b=e.target.closest("[data-play]"); if(!b||e.target.closest("[data-hole]")) return; go({view,render:()=>playPage(b.dataset.play)}); });

function side(S){
  const pkgs=PACKAGES.filter(p=>p.side===S&&!p.hidden);
  main.innerHTML = `<h2 class="disp">${S==="O"?"Offense":"Defense"}</h2>
   ${pkgs.map(pkg=>`<div class="block"><h3 class="disp" style="margin-top:0">${esc(pkg.name)}</h3><p class="note">${esc(pkg.desc)}</p>${posTable(pkg)}</div>`).join("")}
   ${S==="D" ? `<h3 class="disp">Base calls</h3>
   ${["base-run","cover3","cover3-roll","cover3-trips","cover3-doubles"].map(id=>plays.find(q=>q.id===id)).filter(Boolean).map(p=>`<div class="block"><div class="row" style="justify-content:space-between"><div><div class="disp" style="font-size:24px">${esc(p.name)}</div><div class="note">${esc(p.sub||"")}</div></div><button class="chip btn" data-play="${esc(p.id)}">Everybody's job →</button></div><div class="diagram">${diagram(p)}</div><p class="note">${esc(p.summary||"")}</p></div>`).join("")}` : ""}
   <h3 class="disp">Position guides</h3>
   ${Object.entries(GUIDE).filter(([g])=>S==="O"?["OL","QB","RB","H","TE","WR"].includes(g):["DE","NG","EDGE","OLB","MIKE","CB","S"].includes(g)).map(([g,v])=>`<div class="block"><h4>${esc(v.title)}</h4><p>${esc(v.text)}</p></div>`).join("")}`;
  main.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>go({view,render:()=>player(b.dataset.p)})));
}

function posTable(pkg){
  const order = pkg.side==="O" ? ["QB","RB","H","X","Y","Z","LT","LG","C","RG","RT"] : ["S","CBL","CBR","OLBL","MIKE","OLBR","EDGEL","DEL","NG","DER","EDGER"];
  return `<table><tr><th>Pos</th><th>Players</th></tr>${order.filter(s=>pkg.spots[s]).map(s=>
    `<tr><td class="pos">${labelOf(s,pkg)}</td><td><div class="row">${pkg.spots[s].map(n=>`<button data-p="${esc(n)}" class="chip btn">${esc(shortName(n))}</button>`).join("")}</div></td></tr>`).join("")}</table>`;
}

function player(name){
  const as=assignments(name);
  const oSpots=[...new Set(as.filter(a=>a.pkg.side==="O").map(a=>a.spot))];
  const dSpots=[...new Set(as.filter(a=>a.pkg.side==="D").map(a=>a.spot))];
  let h=`<h2 class="disp">${esc(name)}</h2><div class="row" style="margin-bottom:14px">${as.map(a=>`<span class="chip gold">${esc(a.pkg.name)} · ${labelOf(a.spot,a.pkg)}</span>`).join("")||'<span class="note">No position assigned yet — see Coach.</span>'}</div>`;
  const section=(S,spots)=>{
    if(!spots.length) return "";
    let x=`<h3 class="disp">${S==="O"?"Offense":"Defense"}</h3>`;
    spots.forEach(spot=>{
      const g=GUIDE[GROUP[spot]];
      x+=`<div class="block"><h4>${labelOf(spot,null)} — ${esc(g.title)}</h4><p>${esc(g.text)}</p></div>`;
      const mine=plays.filter(p=>p.side===S&&p.assign&&p.assign[spot]);
      if(mine.length){
        x+=`<h4>Your job on each play as ${labelOf(spot,null)}</h4>`;
        mine.forEach(p=>{ x+=conceptBlock(p, spot); });
      }
    });
    return x;
  };
  main.innerHTML = h + section("O",oSpots) + section("D",dSpots);
  wirePlays();
}

function holeChips(p, hole, key){ return p.holes ? `<div class="row" style="margin:8px 0 4px">${p.holes.map(h=>`<button class="chip btn ${h===hole?'gold':''}" data-hole="${h}" data-key="${esc(key)}">${p.series?p.series[0]:""}${h} Run</button>`).join("")}</div>` : ""; }
function jobText(p, spot, hole){ let v=p.assign[spot]; if(p.holes && v.byHole && v.byHole[hole]) v={...v,...v.byHole[hole]}; return p.holes ? holeText(v.job, hole) : v.job; }
main.addEventListener("click", e=>{
  const b=e.target.closest("[data-hole]"); if(!b) return;
  const key=b.dataset.key, hole=+b.dataset.hole;
  if(key.startsWith("play:")) playPage(key.slice(5), hole);
  else { const [pid,spot]=key.split("|"); const box=b.closest("[data-concept]"); if(box){ box.outerHTML=conceptBlock(plays.find(q=>q.id===pid), spot, hole); } }
});
function conceptBlock(p, spot, hole){
  hole = hole || p.defaultHole;
  const title = p.holes ? `${p.series?p.series[0]:""}${hole} Run` : p.name;
  return `<div class="block" data-concept="${esc(p.id)}"><div class="row" style="justify-content:space-between"><div><div class="disp" style="font-size:24px">${esc(title)}</div><div class="note">${esc(p.holes?p.name+" · "+p.sub:(p.sub||""))}</div></div><button class="chip btn" data-play="${esc(p.id)}">Full play →</button></div>
     ${holeChips(p, hole, p.id+"|"+spot)}
     ${(formsOf(p).length?formsOf(p):[null]).map(k=>`${k&&formsOf(p).length>1?`<div class="note" style="margin-top:8px">From ${esc(FORMATIONS[k].name)}</div>`:""}<div class="diagram">${diagram(p,spot,k,hole)}</div>`).join("")}
     <div class="resp me"><div class="who">${labelOf(spot,null)} · you</div><div class="what">${esc(jobText(p,spot,hole))}</div></div></div>`;
}
function playPage(id, hole){
  const p=plays.find(q=>q.id===id); if(!p) return;
  hole = hole || p.defaultHole;
  const order = p.side==="O" ? ["QB","RB","H","X","Y","Z","LT","LG","C","RG","RT"] : ["S","CBL","CBR","OLBL","MIKE","OLBR","EDGEL","DEL","NG","DER","EDGER"];
  const pkg = PACKAGES.find(k=>k.id===p.pkg)||PACKAGES.find(k=>k.side===p.side);
  const fks = formsOf(p);
  const title = p.holes ? `${p.series?p.series[0]:""}${hole} Run` : p.name;
  main.innerHTML = `<h2 class="disp">${esc(title)}</h2><p class="note">${esc(p.holes?p.name+" · "+p.sub:(p.sub||""))}${fks.length===1?` · ${esc(FORMATIONS[fks[0]].name)}`:""}</p>
   ${holeChips(p, hole, "play:"+p.id)}
   ${fks.length ? fks.map(k=>`${fks.length>1?`<h4>From ${esc(FORMATIONS[k].name)}</h4>`:""}<div class="diagram">${diagram(p,null,k,hole)}</div>`).join("") : `<div class="diagram">${diagram(p)}</div>`}
   <p>${esc(p.summary||"")}</p>
   <h4>Everybody's job${p.holes?` on ${esc(title)}`:""}</h4>
   ${order.filter(s=>p.assign[s]).map(s=>`<div class="resp"><div class="who">${labelOf(s,pkg)}</div><div class="what">${esc(jobText(p,s,hole))}</div></div>`).join("")}`;
}

VIEWS.roster();
</script>
</body>
</html>
