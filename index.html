<style>
html,body{height:100%;margin:0;background:#101010;color:#f4f3ec;font-family:"IBM Plex Sans",system-ui,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{width:100%;max-width:360px;background:#1c1c1c;border:1px solid rgba(244,243,236,.12);border-top:3px solid #e8393c;border-radius:10px;padding:26px 22px}
.k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.65;font-weight:600}

input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:12px 14px;border-radius:6px;border:1px solid rgba(244,243,236,.25);background:#000;color:#f4f3ec;outline:none}
input:focus{border-color:#e8393c}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:13px;border:0;border-radius:6px;background:#e8393c;color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#ff7a7a;font-size:13px;margin-top:10px;min-height:18px}
.note{font-size:12px;color:#9a9a92;margin-top:14px;line-height:1.5}
</style></head>

const b2u = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b2u(SALT), iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2u(IV)}, key, b2u(CT));
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const $=id=>document.getElementById(id);
async function attempt(pw, quiet){
  $("go").disabled=true; $("err").textContent="";
  try{ await unlock(pw); localStorage.setItem("mhsblack_pw", pw); }
  catch(e){ $("go").disabled=false; if(!quiet) $("err").textContent="That's not it. Check with your coach."; }
}
$("go").addEventListener("click", ()=>attempt($("pw").value.trim(), false));
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") attempt($("pw").value.trim(), false); });
const saved = localStorage.getItem("mhsblack_pw"); if(saved) attempt(saved, true); else $("pw").focus();
